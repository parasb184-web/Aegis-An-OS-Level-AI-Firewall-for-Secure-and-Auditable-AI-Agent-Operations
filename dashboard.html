<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis</title>
<style>
  :root {
    --bg:      #16181d;
    --panel:   #1c1f26;
    --line:    #2a2f38;
    --text:    #dfe3e8;
    --dim:     #79828f;
    --allow:   #4ea882;
    --warn:    #d9a03c;
    --block:   #e0575e;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "DejaVu Sans Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }

  /* ---- header ---------------------------------------------------- */
  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
  .watching { color: var(--dim); font-size: 12px; }
  .live {
    margin-left: auto;
    display: flex; align-items: center; gap: 7px;
    color: var(--dim); font-size: 12px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--allow);
  }
  .dot.stale { background: var(--block); }

  /* ---- tally ------------------------------------------------------ */
  .tally { display: flex; align-items: flex-end; gap: 34px; margin: 26px 0 8px; }
  .stat .n { font-size: 34px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 11px; color: var(--dim); margin-top: 5px; }
  .stat .tot { font-size: 10px; color: #5c6572; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat.allow .n { color: var(--allow); }
  .stat.warn  .n { color: var(--warn); }
  .stat.block .n { color: var(--block); }

  .ratio {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--block);
    display: flex;
    margin-bottom: 6px;
  }
  .ratio > i { display: block; background: var(--allow); transition: width .4s ease; }
  .ratio > i.w { background: var(--warn); }

  /* ---- controls --------------------------------------------------- */
  .controls { display: flex; gap: 8px; margin: 22px 0 10px; align-items: center; }
  .controls .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .status { font-size: 12px; color: var(--dim); margin-left: 4px; }
  .status.err { color: var(--block); }
  .status.busy { color: var(--warn); }
  button {
    font: inherit;
    font-size: 12px;
    color: var(--dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 5px 11px;
    cursor: pointer;
  }
  button:hover { color: var(--text); }
  button[aria-pressed="true"] { color: var(--text); border-color: #48505c; background: var(--panel); }
  button:focus-visible { outline: 2px solid var(--allow); outline-offset: 2px; }

  /* ---- feed ------------------------------------------------------- */
  .feed { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }

  .head, .row {
    display: grid;
    grid-template-columns: 74px 92px 1fr 200px;
    gap: 16px;
    padding: 9px 16px 9px 13px;
    align-items: baseline;
  }
  .head {
    color: var(--dim);
    font-size: 11px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding-left: 16px;
  }

  .row { border-bottom: 1px solid #22262e; border-left: 3px solid transparent; }
  .row:last-child { border-bottom: none; }
  .row.block { border-left-color: var(--block); background: rgba(224, 87, 94, .06); }
  .row.warn  { border-left-color: var(--warn);  background: rgba(217, 160, 60, .06); }
  .row.allow { border-left-color: #2f3a44; }

  .t { color: var(--dim); font-variant-numeric: tabular-nums; }
  .proc { color: var(--dim); }
  .path { overflow-wrap: anywhere; }
  .path b { color: #fff; font-weight: 600; }
  .why { color: var(--dim); font-size: 12px; }
  .row.block .why { color: var(--block); }
  .row.warn  .why { color: var(--warn); }

  /* one flash when a decision is new, so you can see what just changed */
  @keyframes land { from { background: rgba(255,255,255,.09); } }
  .row.fresh { animation: land .7s ease-out; }
  @media (prefers-reduced-motion: reduce) { .row.fresh { animation: none; } }

  .empty { padding: 34px 16px; color: var(--dim); text-align: center; }

  @media (max-width: 720px) {
    .head { display: none; }
    .row { grid-template-columns: 1fr; gap: 3px; padding: 11px 14px; }
    .tally { flex-wrap: wrap; gap: 22px; }
    .ratio { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Aegis</h1>
    <span class="watching">file access decisions</span>
    <span class="live"><span class="dot" id="dot"></span><span id="pulse">connecting</span></span>
  </header>

  <div class="tally">
    <div class="stat allow"><div class="n" id="allow">0</div><div class="k">allowed</div><div class="tot" id="allow-tot"></div></div>
    <div class="stat warn"><div class="n" id="warn">0</div><div class="k">warned</div><div class="tot" id="warn-tot"></div></div>
    <div class="stat block"><div class="n" id="block">0</div><div class="k">blocked</div><div class="tot" id="block-tot"></div></div>
    <div class="ratio"><i id="bar" style="width:100%"></i><i class="w" id="barw" style="width:0%"></i></div>
  </div>

  <div class="controls">
    <button id="f-all"   aria-pressed="true">Everything</button>
    <button id="f-block" aria-pressed="false">Blocked only</button>
    <button id="hold"    aria-pressed="false">Pause</button>
    <span class="sep"></span>
    <button id="r-normal">Run normal</button>
    <button id="r-credentials">Run credentials</button>
    <button id="r-massread">Run mass read</button>
    <span class="sep"></span>
    <button id="reset" title="Count from now on. The audit log is not touched.">Reset counters</button>
    <span class="status" id="runstatus"></span>
  </div>

  <div class="feed">
    <div class="head">
      <span>Time</span><span>Process</span><span>File</span><span>Reason</span>
    </div>
    <div id="rows"></div>
  </div>

</div>

<script>
// The page only reads. Every decision here was already made by the daemon
// and written to PostgreSQL. We ask the API for fresh numbers once a second.

let filter = "all";
let paused = false;

// The audit log holds every decision ever made, which on a developer machine
// means the lifetime totals are enormous and a run of three files does not
// visibly move them. So the tiles show the count SINCE a baseline, with the
// lifetime figure underneath. "Reset counters" moves the baseline to now --
// it deliberately does NOT delete anything. An audit log you can clear from
// a web page is not an audit log.
let base = null;

function loadBase() {
  try {
    const raw = localStorage.getItem("aegis.base");
    if (raw) base = JSON.parse(raw);
  } catch (e) { /* private window or blocked storage: fall back to lifetime */ }
}

function saveBase() {
  try { localStorage.setItem("aegis.base", JSON.stringify(base)); } catch (e) {}
}
loadBase();
let seen = new Set();      // paths+times we have already drawn, to flash new ones
let firstLoad = true;

function ago(hhmmss) {
  // Server sends clock time. "14s ago" reads better than a timestamp when
  // you are watching something happen.
  const [h, m, s] = hhmmss.split(":").map(Number);
  const now = new Date();
  const then = new Date(now);
  then.setHours(h, m, s, 0);
  let diff = Math.round((now - then) / 1000);
  if (diff < 0) diff += 86400;          // rolled past midnight
  if (diff < 60) return diff + "s ago";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  return hhmmss;
}

function shortPath(p) {
  // Keep the last two segments bright, dim the rest. The filename and its
  // folder are what you are actually reading.
  const parts = p.split("/");
  if (parts.length < 3) return p;
  const tail = parts.slice(-2).join("/");
  const head = parts.slice(0, -2).join("/") + "/";
  return head + "<b>" + tail + "</b>";
}

function setFilter(name) {
  filter = name;
  document.getElementById("f-all").setAttribute("aria-pressed", name === "all");
  document.getElementById("f-block").setAttribute("aria-pressed", name === "block");
  draw();
}

let latest = [];

function draw() {
  const box = document.getElementById("rows");
  const list = filter === "block"
    ? latest.filter(r => r.verdict === "block")
    : latest;

  if (list.length === 0) {
    box.innerHTML = '<div class="empty">' +
      (filter === "block" ? "Nothing has been blocked yet."
                          : "No activity yet. Start the daemon and open a file.") +
      '</div>';
    return;
  }

  box.innerHTML = "";
  for (const r of list) {
    const key = r.time + r.path + r.verdict;
    const div = document.createElement("div");
    div.className = "row " + r.verdict + (!firstLoad && !seen.has(key) ? " fresh" : "");
    div.innerHTML =
      '<span class="t">'    + ago(r.time)          + '</span>' +
      '<span class="proc">' + (r.process || "?")   + '</span>' +
      '<span class="path">' + shortPath(r.path)    + '</span>' +
      '<span class="why">'  + (r.reason || "")     + '</span>';
    box.appendChild(div);
    seen.add(key);
  }
  firstLoad = false;
}

async function refresh() {
  if (paused) return;
  try {
    const counts = await (await fetch("/counts")).json();
    const la = counts.allow || 0, lw = counts.warn || 0, lb = counts.block || 0;

    // First sight of the numbers becomes the baseline, so the page starts at
    // zero and climbs as decisions arrive rather than opening on a huge total.
    if (base === null) { base = {allow: la, warn: lw, block: lb}; saveBase(); }

    // A reset after rows were archived, or a rebuilt database, can leave the
    // baseline above the live total. Clamp rather than show negatives.
    const a = Math.max(0, la - base.allow);
    const w = Math.max(0, lw - base.warn);
    const b = Math.max(0, lb - base.block);

    document.getElementById("allow").textContent = a;
    document.getElementById("warn").textContent = w;
    document.getElementById("block").textContent = b;
    document.getElementById("allow-tot").textContent = "of " + la.toLocaleString() + " total";
    document.getElementById("warn-tot").textContent  = "of " + lw.toLocaleString() + " total";
    document.getElementById("block-tot").textContent = "of " + lb.toLocaleString() + " total";
    // A warn still opens the file, so it sits on the allowed side of the
    // bar rather than the blocked side -- but in its own colour, because
    // "allowed and worth a look" is not the same as "allowed".
    const total = a + w + b;
    document.getElementById("bar").style.width =
      (total === 0 ? 100 : (a / total) * 100) + "%";
    document.getElementById("barw").style.width =
      (total === 0 ? 0 : (w / total) * 100) + "%";

    // Ask the API whether an agent is actually still running, rather than
    // trusting what the button said when it was clicked.
    try {
      const run = await (await fetch("/run")).json();
      const status = document.getElementById("runstatus");
      if (run.running) {
        status.className = "status busy";
        status.textContent = "running (pid " + run.pid + ")";
      } else if (status.classList.contains("busy")) {
        status.className = "status";
        status.textContent = run.pid ? "finished (pid " + run.pid + ")" : "";
      }
    } catch (e) { /* the counts fetch above already reports connection loss */ }

    latest = await (await fetch("/recent")).json();
    draw();

    document.getElementById("dot").classList.remove("stale");
    document.getElementById("pulse").textContent = "live";
  } catch (e) {
    document.getElementById("dot").classList.add("stale");
    document.getElementById("pulse").textContent = "no connection";
  }
}

document.getElementById("f-all").onclick   = () => setFilter("all");
document.getElementById("f-block").onclick = () => setFilter("block");
// Starting a scenario is the one thing this page does that is not a read.
// The API refuses a second run while one is going, so the button only has
// to report what it was told rather than track state itself.
async function runScenario(name) {
  const status = document.getElementById("runstatus");
  status.className = "status busy";
  status.textContent = "starting " + name + " ...";
  try {
    const res = await fetch("/run/" + name, {method: "POST"});
    if (!res.ok) {
      status.className = "status err";
      status.textContent = "error: " + res.status;
      return;
    }
    const body = await res.json();
    if (body.started) {
      status.className = "status busy";
      status.textContent = "running " + name + " (pid " + body.pid + ")";
    } else {
      status.className = "status err";
      status.textContent = body.reason || "could not start";
    }
  } catch (e) {
    status.className = "status err";
    status.textContent = "no connection";
  }
}

for (const name of ["normal", "credentials", "massread"]) {
  document.getElementById("r-" + name).onclick = () => runScenario(name);
}

document.getElementById("reset").onclick = async () => {
  const status = document.getElementById("runstatus");
  try {
    const c = await (await fetch("/counts")).json();
    base = {allow: c.allow || 0, warn: c.warn || 0, block: c.block || 0};
    saveBase();
    seen = new Set();
    status.className = "status";
    status.textContent = "counters reset (log untouched)";
    refresh();
  } catch (e) {
    status.className = "status err";
    status.textContent = "no connection";
  }
};

document.getElementById("hold").onclick = (e) => {
  paused = !paused;
  e.target.setAttribute("aria-pressed", paused);
  e.target.textContent = paused ? "Resume" : "Pause";
};

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
